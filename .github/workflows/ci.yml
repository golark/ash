name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build
      run: make build

    - name: Smoke test
      run: |
        ./build/ash 2>&1 | head -3
        # No args -> usage and exit 1; we accept that so the step does not fail
        ./build/ash 2>&1 || true
