name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-13
            platform: darwin
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Build application
      run: |
        make build
    
    - name: Create release package
      run: |
        make release
      env:
        VERSION: ${GITHUB_REF#refs/tags/}
        PLATFORM: ${{ matrix.platform }}
        ARCH: ${{ matrix.arch }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ash-${{ matrix.platform }}-${{ matrix.arch }}
        path: dist/*.tar.gz
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          **/*.tar.gz
        body: |
          ## Ash ${{ github.ref_name }}
          
          AI-powered shell assistant that translates natural language to shell commands (bash, zsh, etc.).
          
          ### Installation
          
          **macOS (Homebrew):**
          ```bash
          brew tap golark/ash
          brew install ash
          ```
          
          **Linux / macOS (manual):**
          Download the tarball for your platform below and extract:
          - `ash-*-darwin-arm64.tar.gz` — macOS Apple Silicon
          - `ash-*-darwin-amd64.tar.gz` — macOS Intel
          - `ash-*-linux-amd64.tar.gz` — Linux x86_64
          
          ```bash
          tar -xzf ash-*-linux-amd64.tar.gz
          cd ash-* && cp ash widget.zsh /usr/local/bin/  # or ~/.local/bin
          ```
